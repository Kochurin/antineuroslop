<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проверка Антинейрослопа</title>
<style>
  body { margin: 0; background: #ececee; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #111; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 36px 24px; display: flex; flex-direction: column; gap: 22px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); padding: 18px 20px; }
  h2 { margin: 0 0 10px; font-size: 15px; color: #6b6b70; font-weight: 600; }
  textarea { width: 100%; box-sizing: border-box; min-height: 150px; border: 1px solid #dcdce0; border-radius: 12px; padding: 12px 14px; font: inherit; resize: vertical; outline: none; }
  textarea:focus, .chat:focus, input:focus { border-color: #9b9ba3; }
  input { width: 100%; box-sizing: border-box; border: 1px solid #dcdce0; border-radius: 10px; padding: 9px 12px; font: inherit; outline: none; }
  .chat { min-height: 60px; border: 1px solid #dcdce0; border-radius: 22px; padding: 10px 16px; outline: none; }
  .chat:empty::before { content: attr(data-placeholder); color: #9b9ba3; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>Новый пост</h2>
    <textarea id="ta" placeholder="Что нового?"></textarea>
  </div>
  <div class="card">
    <h2>Сообщение</h2>
    <div id="ce" class="chat" contenteditable="true" data-placeholder="Написать сообщение…"></div>
  </div>
  <div class="card">
    <h2>Тема письма</h2>
    <input id="inp" type="text" placeholder="Тема">
  </div>
</div>
</body>
</html>
